# Public demo of Ardu's AI: MCP server + self-hosted model + quote library.
# No user data lives here. Only Caddy publishes ports (80/443).
#
#   cp .env.example .env    # set MCP_DOMAIN, MCP_TOKEN, POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:1.5b
name: ardu-demo

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ardu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ardu
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../backend/migrations:/ardu/migrations:ro
      - ../backend/seeds:/ardu/seeds:ro
      - ../mcp/sql:/ardu/mcp-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardu -d ardu"]
      interval: 10s
      retries: 5

  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # one generation at a time on a 2-vCPU box
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "24h"        # keep the model warm between requests
    volumes:
      - ollama_models:/root/.ollama

  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ardu:${POSTGRES_PASSWORD}@db:5432/ardu
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      ALLOWED_HOSTS: ${MCP_DOMAIN:?set MCP_DOMAIN in .env}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp

volumes:
  db_data:
  ollama_models:
  caddy_data:
